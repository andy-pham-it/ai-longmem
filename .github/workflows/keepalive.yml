name: keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping longmem health
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.LONGMEM_TOKEN }}" \
            "${{ secrets.LONGMEM_URL }}/health"
